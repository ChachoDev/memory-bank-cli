[project]
name = "memory-bank-cli"
version = "1.0.0"
description = "A Python CLI utility for automating and managing persistent AI Memory Banks across multiple IDEs and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Victor M. Cañada Ojeda", email = "elchachodev@gmail.com" },
]
keywords = ["ai", "agents", "memory-bank", "context-engineering", "claude", "cursor", "opencode"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

# Only the standard library is used (pathlib, locale, json, subprocess, shutil).
dependencies = []

[project.urls]
Homepage = "https://github.com/TU-USUARIO/memory-bank-cli"
Repository = "https://github.com/TU-USUARIO/memory-bank-cli"
Issues = "https://github.com/TU-USUARIO/memory-bank-cli/issues"
Changelog = "https://github.com/TU-USUARIO/memory-bank-cli/blob/main/CHANGELOG.md"

[project.scripts]
memory-bank = "memory_bank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_bank"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
