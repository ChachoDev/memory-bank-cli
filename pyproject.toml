[project]
name = "memory-bank-cli"
version = "1.2.0"
description = "Markdown memory bank for AI coding agents — create, sync, and validate across sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Victor M. Cañada Ojeda", email = "elchachodev@gmail.com" },
]
keywords = ["ai", "agents", "memory-bank", "context-engineering", "claude", "cursor", "opencode", "junie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
]

# Only the standard library is used (pathlib, locale, json, subprocess, shutil).
dependencies = []

[project.urls]
Homepage = "https://github.com/ChachoDev/memory-bank-cli"
Repository = "https://github.com/ChachoDev/memory-bank-cli"
Issues = "https://github.com/ChachoDev/memory-bank-cli/issues"
Changelog = "https://github.com/ChachoDev/memory-bank-cli/blob/main/CHANGELOG.md"

[project.scripts]
memory-bank = "memory_bank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_bank"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
