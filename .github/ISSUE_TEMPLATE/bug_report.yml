name: Bug report
description: Something does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can:
        a reproducible report is the fastest way to a fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The exact command you ran, what you expected and what you saw instead.
      placeholder: |
        I ran `memory-bank sync` and expected ...
        Instead, it ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh Git repository if possible.
      placeholder: |
        1. git init
        2. uv tool install .
        3. memory-bank start
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: memory-bank version
      description: Output of `memory-bank --version`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version` or `uv run python --version`.
      placeholder: "3.13.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output or files
      description: Paste the command output, or the generated files involved.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets, tokens and personal data from the output.
          required: true
