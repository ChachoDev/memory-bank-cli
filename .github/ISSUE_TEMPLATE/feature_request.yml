name: Feature request
description: Suggest a new command, option, agent integration or behaviour.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening this request, check that the feature fits the project's scope:
        a small, standard-library-only CLI that writes Markdown files and agent configuration.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the tool does not let you do today?
      placeholder: |
        When I work with ... I have to ... which is not covered by ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like memory-bank to behave? Include the command and expected output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing tools or workarounds you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New agent integration
        - New command or option
        - Generated templates
        - Stack detection
        - Links and hooks
        - Translations
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request does not require third-party runtime dependencies.
          required: true
